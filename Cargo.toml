[package]
name        = "incident-correlation"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.85"
description = "Walks the Kinetic Gain Protocol Suite graph (AEO + agent-cards + tool-cards + decision-cards) starting from an AI Incident Card and emits a structured remediation plan."
license     = "MIT"
repository  = "https://github.com/mizcausevic-dev/incident-correlation-rs"
homepage    = "https://kineticgain.com/"
documentation = "https://docs.rs/incident-correlation"
readme      = "README.md"
keywords    = ["ai-incidents", "decision-intelligence", "graph", "kinetic-gain", "remediation"]
categories  = ["data-structures", "asynchronous"]
authors     = ["Miz Causevic <miz@kineticgain.com>"]

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1.0"
petgraph   = "0.6"

[dev-dependencies]
tokio      = { version = "1.38", features = ["macros", "rt"] }
criterion  = { version = "0.5" }

[[bench]]
name    = "correlate"
harness = false

[lib]
name = "incident_correlation"
path = "src/lib.rs"
