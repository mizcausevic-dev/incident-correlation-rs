[package]
name        = "incident-correlation"
version     = "0.2.0"
edition     = "2021"
rust-version = "1.88"
description = "Builds suggested remediation plans from a caller-supplied Suite graph and an Incident Card projection. Optional best-effort audit event."
license     = "MIT"
repository  = "https://github.com/mizcausevic-dev/incident-correlation-rs"
homepage    = "https://kineticgain.com/"
documentation = "https://docs.rs/incident-correlation"
readme      = "README.md"
include     = ["src/**", "tests/**", "examples/**", "benches/**", "README.md", "LICENSE"]
keywords    = ["ai-incidents", "decision-intel", "graph", "kinetic-gain", "remediation"]
categories  = ["data-structures", "asynchronous"]
authors     = ["Miz Causevic <miz@kineticgain.com>"]

[features]
default      = []
# Opt-in HTTP emitter that POSTs governance events to audit-stream-py.
# Pulls in reqwest + tokio. Off by default so the core library stays sync
# and dependency-light.
audit-stream = ["dep:reqwest", "dep:tokio"]

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1.0"
petgraph   = "0.6"
# Optional, only pulled in when the `audit-stream` feature is enabled.
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio      = { version = "1.38", features = ["rt", "macros", "time"], optional = true }

[dev-dependencies]
tokio      = { version = "1.38", features = ["macros", "rt"] }
criterion  = { version = "0.5" }
wiremock   = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name    = "correlate"
harness = false

[lib]
name = "incident_correlation"
path = "src/lib.rs"
