name: Publish to crates.io

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Require tagged commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tagged commit is not on main"
            exit 1
          fi
      - name: Verify Cargo.toml version matches tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -Dwarnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Doc tests
        run: cargo test --locked --doc --all-features
      - name: RustSec advisory scan
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock
      - name: Dry-run publish
        run: cargo publish --locked --dry-run
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
